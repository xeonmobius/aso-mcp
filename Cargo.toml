[package]
name = "aso-mcp"
version = "0.1.0"
edition = "2024"
description = "ASO keyword research MCP server: App Store & Google Play keyword discovery, ranking, and difficulty analysis for LLM clients"
license = "MIT"
repository = "https://github.com/xeonmobius/aso-mcp"
homepage = "https://github.com/xeonmobius/aso-mcp"
readme = "README.md"
keywords = ["aso", "mcp", "app-store", "google-play", "seo"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.104"
plist = "1.10.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
